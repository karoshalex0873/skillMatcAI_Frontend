<div class="min-h-screen bg-primary flex items-center justify-center p-4">
  <div class="bg-dark-100 rounded-xl shadow-lg p-6 max-w-sm w-full border border-dark-200/50">
    <div class="flex justify-center mb-4">
      <!-- Optional logo or icon -->
      <span class="text-2xl text-light-100 "><ng-icon name="ionLockClosed" class="w-10 h-10 text-light-200"></ng-icon></span>
    </div>
    <h2 class="text-2xl font-semibold text-light-100 mb-6 text-center">
      Welcome Back
    </h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Email Field -->
      <div>
        <label class="block text-light-200 text-sm mb-1 font-medium">Email</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-3 py-2 text-sm rounded-lg bg-dark-200 border border-dark-300 text-light-100 focus:border-light-200 focus:ring-2 focus:ring-light-200/30 transition-all placeholder-dark-400"
          placeholder="your@email.com"
        />
        <div
          *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          class="text-red-400 mt-1 text-xs flex items-center gap-1 animate-fade-in"
        >
          <ng-icon name="ionAlertCircle" class="w-3 h-3"></ng-icon>
          Valid email required
        </div>
      </div>

      <!-- Password Field -->
      <div>
        <label class="block text-light-200 text-sm mb-1 font-medium">Password</label>
        <div class="relative">
          <input
            type="password"
            formControlName="password"
            (input)="onPasswordChange($event)"
            class="w-full px-3 py-2 text-sm rounded-lg bg-dark-200 border border-dark-300 text-light-100 focus:border-light-200 focus:ring-2 focus:ring-light-200/30 transition-all placeholder-dark-400"
            placeholder="••••••••"
          />
          <!-- Optional password visibility toggle could be added here -->
        </div>
        <div
          *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          class="text-red-400 mt-1 text-xs flex items-center gap-1 animate-fade-in"
        >
          <ng-icon name="ionAlertCircle" class="w-3 h-3"></ng-icon>
          Min. 8 characters
        </div>
      </div>

      <!-- Error Notification -->
      <div 
        *ngIf="errorMessage" 
        class="mt-2 bg-red-900/30 backdrop-blur-sm rounded-lg flex items-start gap-2 p-2 border border-red-700/50 shadow-lg animate-fade-in"
      >
        <span class="text-light-100"><ng-icon name="ionWarning" class="w-4 h-4 mt-0.5 text-red-400 flex-shrink-0"></ng-icon></span>
        <p class="text-red-300 text-xs leading-tight">{{ errorMessage }}</p>
      </div>

      <!-- Remember Me -->
      <div class="flex items-center justify-between pt-1">
        <div class="flex items-center space-x-2">
          <input
            type="checkbox"
            formControlName="rememberMe"
            class="w-4 h-4 rounded border-dark-300 text-light-100 focus:ring-2 focus:ring-light-200/30 bg-dark-200 checked:bg-primary"
          />
          <label class="text-light-200 text-sm">Remember me</label>
        </div>
        <a href="#" class="text-xs text-light-200 hover:text-light-100 underline">Forgot password?</a>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full bg-light-100 text-primary text-sm py-2.5 rounded-lg hover:bg-light-200 transition-colors font-medium cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed mt-2"
      >
        Sign In
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-6 text-center">
      <p class="text-light-200 text-xs">
        New user?
        <a
          routerLink="/register"
          class="text-light-100 hover:text-light-200 underline font-medium"
          >Create account</a
        >
      </p>
    </div>
  </div>
</div>

<!-- Add this to your global styles for the animation -->
<style>
  .animate-fade-in {
    animation: fadeIn 0.3s ease-in-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
